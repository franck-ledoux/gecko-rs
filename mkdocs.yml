site_name: gecko-rs
site_description: Developer documentation for the Rust port of the Gecko block toolkit
site_url: https://franck-ledoux.github.io/gecko-rs/
repo_url: https://github.com/franck-ledoux/gecko-rs
repo_name: franck-ledoux/gecko-rs
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets

plugins:
  - search

nav:
  - Home: index.md
  # An external link: the application is published beside this site by the
  # same workflow, and a reader looking for it should not have to read a
  # paragraph to find out it exists.
  - Open gecko: https://franck-ledoux.github.io/gecko-rs/app/
  - User Guide:
      - The interface: user-guide/interface.md
      - Running it: user-guide/running.md
      - Appearance: user-guide/display.md
      - Geometry: user-guide/geometry.md
      - Classification: user-guide/classification.md
      - Joining and removing blocks: user-guide/gluing.md
      - Sheets: user-guide/sheets.md
      - Chords: user-guide/chords.md
      - Pillowing: user-guide/pillowing.md
      - Meshing: user-guide/meshing.md
      - Scripting: user-guide/scripting.md
  - Developer Guide:
      - Architecture: developer-guide/architecture.md
      - Building: developer-guide/building.md
      - Testing: developer-guide/testing.md
      - Rust API reference: developer-guide/api.md
      - Writing documentation: developer-guide/documentation.md
