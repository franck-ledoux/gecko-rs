[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gecko"
version = "0.1.0"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Franck Ledoux" }]
description = "Block toolkit — Rust kernel, Python API, browser viewer."

[tool.maturin]
features = ["pyo3/extension-module"]
