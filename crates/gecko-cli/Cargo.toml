[package]
name = "gecko-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The local launcher: serve the page, or run a script without one."

# The library is where `files` and `serve` live, so the tests link the same
# code the binary does rather than a second copy of the source.
[lib]
name = "gecko_cli"
path = "src/lib.rs"

[[bin]]
name = "gecko"
path = "src/main.rs"

[dependencies]
gecko-cmd = { workspace = true }
gecko-lua = { path = "../gecko-lua" }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
include_dir = "0.7"
mime_guess = "2"
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# To drive the router without a port, a runtime or a browser.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
