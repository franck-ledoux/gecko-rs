[workspace]
resolver = "2"
members = ["crates/gecko-core", "crates/gecko-cmd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
honeycomb-core = "0.12"
thiserror = "2"
gecko-core = { path = "crates/gecko-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
