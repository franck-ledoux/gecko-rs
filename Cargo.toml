[workspace]
resolver = "2"
members = [
    "crates/gecko-core",
    "crates/gecko-geom",
    "crates/gecko-cmd",
    "crates/gecko-lua",
    "crates/gecko-lua-wasm",
    "crates/gecko-cli",
    "crates/gecko-wasm",
    "crates/gecko-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
honeycomb-core = "0.12"
thiserror = "2"
gecko-core = { path = "crates/gecko-core" }
gecko-geom = { path = "crates/gecko-geom" }
gecko-cmd = { path = "crates/gecko-cmd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
