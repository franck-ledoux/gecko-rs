name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The kernel alone, everywhere. Fast, and it is what most changes touch.
  # `gecko-lua` builds Lua from C, so this is also where a platform without
  # a working C compiler would say so.
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The whole chain, in one place: the page needs both wasm modules, and the
  # browser suite needs the page. There is nothing to split out — the pieces
  # only mean anything together.
  full:
    name: The whole page, in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-unknown-emscripten

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      # mlua compiles to WebAssembly through emscripten only, which is why
      # the interpreter is a second module rather than part of the kernel.
      - name: Install the Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install the browser Playwright drives
        working-directory: front
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Everything
        # The same script a developer runs. What passes locally passes here.
        run: ./check.sh

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report
          retention-days: 7

      # The page itself, for the site to publish. It is built here anyway —
      # `check.sh` needs it to run the browser suite — so publishing it
      # costs an upload rather than a second toolchain.
      - name: Keep the page for the site
        uses: actions/upload-artifact@v4
        with:
          name: page
          path: front/dist
          retention-days: 1

      # Coverage for the page, here rather than in a job of its own: this
      # one already has the emsdk, both wasm modules, the bundle and the
      # browser, and setting all that up again would cost more minutes than
      # the measurement does. The suites are run a second time with the
      # collector on, which is a minute, and `check.sh` stays untouched so
      # what a developer runs locally is still what runs here.
      #
      # **After** the page has been uploaded, and that order matters: a
      # coverage run rebuilds the bundle unminified, and the site must have
      # the one that ships.
      - name: What the page's own tests reach
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: ./coverage page

      - name: Keep it for the site
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-page
          path: |
            target/coverage/page/e2e
            target/coverage/page-badge.json
          retention-days: 1

  # The kernel's own coverage. A job of its own because it needs no
  # emscripten, no bundle and no browser — just the crates, instrumented —
  # and it runs **only on main and on tags**: a floor is a condition of
  # delivery, and every branch paying for it would be minutes for nothing.
  coverage:
    name: Coverage, the kernel
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # A prebuilt binary: compiling the tool would cost more than running it.
      - uses: taiki-e/install-action@cargo-llvm-cov

      # The same script a developer runs, one half of it. The floors live
      # there, so there is one place to read them and one place to change
      # them.
      - name: Instrument, run everything, and mind the floor
        run: ./coverage kernel

      - name: Keep it for the site
        uses: actions/upload-artifact@v4
        with:
          name: coverage-kernel
          path: |
            target/coverage/kernel/html
            target/coverage/kernel-badge.json
          retention-days: 1

  # Builds the site on every push, which is what keeps the links honest:
  # docs.sh passes --strict, so a dead link or a page missing from the
  # navigation fails here rather than greeting a reader.
  docs:
    name: Documentation
    # Waits for coverage when it runs, and does not wait for it when it is
    # skipped: a needed job that is skipped would otherwise skip this one,
    # and a branch would stop building the site.
    needs: [full, coverage]
    if: ${{ !cancelled() && needs.full.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MkDocs is a Python tool. That is a documentation toolchain, not a
      # dependency of anything that ships.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build the site
        run: ./docs.sh

      # The application, under the documentation that describes it. The
      # page carries its own kernel and its own interpreter, so a static
      # host is all it ever needed.
      - name: Put the page under /app
        uses: actions/download-artifact@v4
        with:
          name: page
          path: site/app

      # Both coverage reports, under the documentation that explains what
      # they do and do not measure. Skipped on a branch, where the two jobs
      # above do not run: `continue-on-error` rather than a condition, so
      # this stays one list of steps however the run was triggered.
      - name: Put the kernel's coverage under /coverage/kernel
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-kernel
          path: coverage-kernel

      - name: Put the page's coverage under /coverage/page
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-page
          path: coverage-page

      - name: Lay them out, with an index
        run: |
          mkdir -p site/coverage
          if [ -d coverage-kernel/kernel/html ]; then
            cp -R coverage-kernel/kernel/html site/coverage/kernel
            cp coverage-kernel/kernel-badge.json site/coverage/
          fi
          if [ -d coverage-page/page/e2e ]; then
            cp -R coverage-page/page/e2e site/coverage/page
            cp coverage-page/page-badge.json site/coverage/
          fi
          python3 tools/coverage_index.py site/coverage

      - name: Keep it for the deploy job
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Waits for the repository to go public: GitHub Pages on a private repository
  # needs a paid plan, and a deploy job that always fails is noise. The
  # condition flips on its own — nothing to switch on by hand.
  #
  # `!cancelled()` and the explicit result, rather than letting the chain
  # decide: a failure anywhere upstream of `docs` otherwise skips this job
  # even when `docs` itself is green, and `docs` is written on purpose to
  # build a site without a coverage report. What gates the publication is
  # the one thing that matters — that the page going out passed its browser
  # suite, which is what a green `docs` already means.
  deploy-docs:
    name: Publish the documentation
    needs: docs
    if: >-
      ${{ !cancelled() && needs.docs.result == 'success'
      && github.ref == 'refs/heads/main'
      && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
