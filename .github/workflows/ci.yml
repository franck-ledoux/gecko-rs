name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The kernel alone, everywhere. Fast, and it is what most changes touch.
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        # gecko-py is excluded: linking an extension module needs a Python
        # interpreter's symbols, which only maturin arranges. It is built and
        # tested in the `python` job instead.
        run: cargo clippy --workspace --exclude gecko-py --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude gecko-py

  # Built once, not three times. The bundle is JavaScript — the same bytes on
  # every platform — but it depends on the wasm façade, so producing it needs
  # the Rust toolchain too. That dependency is why the Python job below cannot
  # simply be a lighter one.
  bundle:
    name: Viewer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build
        run: |
          npm ci
          ./build-wasm.sh
          cd front && npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-bundle
          path: front/dist
          retention-days: 1

  # The wheel has to build and work on every platform someone might install it
  # on, viewer included.
  python:
    name: Python wheel (${{ matrix.os }})
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the viewer bundle
        # The wheel embeds it, so it has to be in place before maturin runs.
        uses: actions/download-artifact@v4
        with:
          name: viewer-bundle
          path: front/dist

      - name: Install the package
        run: pip install ./crates/gecko-py

      - name: Test
        run: |
          pip install pytest
          python -m pytest python -q

  # The only place the whole chain can run: the cross-mode test needs the wasm
  # façade and the Python one to have been built from the same tree.
  full:
    name: Both modes end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the browser Playwright drives
        working-directory: front
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Everything
        # The same script a developer runs. What passes locally passes here.
        run: ./check.sh

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report
          retention-days: 7

  # Builds the site on every push, which is what keeps the links honest:
  # docs.sh passes --strict, so a dead link or a page missing from the
  # navigation fails here rather than greeting a reader.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: ./docs.sh

      - name: Keep it for the deploy job
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Waits for the repository to go public: GitHub Pages on a private repository
  # needs a paid plan, and a deploy job that always fails is noise. The
  # condition flips on its own — nothing to switch on by hand.
  deploy-docs:
    name: Publish the documentation
    needs: docs
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
