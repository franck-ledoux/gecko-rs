<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gecko</title>
  </head>
  <body>
    <main id="stage"><canvas id="view"></canvas></main>

    <!-- The verbs, always to hand. An icon and a title each, and every one of
         them has a key as well — the help card is that list. -->
    <nav id="bar" aria-label="Tools">
      <button id="cube" title="Create a cube — C" aria-label="Create a cube">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.6 21 7.3v9.4L12 21.4 3 16.7V7.3Z" />
          <path d="M3 7.3 12 12l9-4.7M12 12v9.4" />
        </svg>
      </button>
      <button id="glue" disabled title="Glue the two selected faces — G" aria-label="Glue faces">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.5h5v13H4ZM15 5.5h5v13h-5Z" />
          <path d="M9.5 12h5" />
        </svg>
      </button>
      <button id="remove" disabled title="Remove the selected block — Del" aria-label="Remove block">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 7h14M10 7V4.5h4V7M6.5 7l1 13h9l1-13" />
        </svg>
      </button>
      <span class="sep"></span>
      <button id="recentre" title="Frame everything — F" aria-label="Frame everything">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 8.5v-5h5M20.5 8.5v-5h-5M3.5 15.5v5h5M20.5 15.5v5h-5" />
          <circle cx="12" cy="12" r="2.6" />
        </svg>
      </button>
      <button id="shot" title="Save a picture — S" aria-label="Save a picture">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 7.5h4l1.6-2.4h5.8L16.5 7.5h4v12h-17Z" />
          <circle cx="12" cy="13" r="3.6" />
        </svg>
      </button>
      <span class="sep"></span>
      <button id="settings" title="Settings — Tab" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 7h17M3.5 12h17M3.5 17h17" />
          <circle cx="9" cy="7" r="2.1" />
          <circle cx="15.5" cy="12" r="2.1" />
          <circle cx="7.5" cy="17" r="2.1" />
        </svg>
      </button>
      <button id="help-open" title="Shortcuts — H" aria-label="Shortcuts">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.8" />
          <path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.3-.9.8-.9 1.5v.5" />
          <circle cx="12" cy="17" r="1" class="dot" />
        </svg>
      </button>
    </nav>

    <aside id="drawer" aria-label="Settings">
      <h2>Colours</h2>
      <div id="swatches"></div>
      <div class="row">
        <button id="preset-dark">Dark</button>
        <button id="preset-light">Light</button>
      </div>
      <label class="check"><input id="show-axes" type="checkbox" checked /> X/Y/Z triad</label>

      <h2>Cells</h2>
      <div id="layers"></div>

      <h2>Picture</h2>
      <label class="slider"
        ><span>size</span>
        <select id="shot-scale" data-test="shot-scale">
          <option value="1">1× — as on screen</option>
          <option value="2">2× — for a figure</option>
          <option value="4">4×</option>
        </select>
      </label>
      <label class="check"
        ><input id="shot-transparent" type="checkbox" data-test="shot-transparent" /> transparent
        background</label
      >
    </aside>

    <footer id="readout">
      <span id="stats"></span>
      <span id="status"></span>
    </footer>

    <div id="help" role="dialog" aria-label="Keyboard shortcuts">
      <div id="help-card"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
