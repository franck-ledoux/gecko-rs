<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gecko</title>
  </head>
  <body>
    <main id="stage"><canvas id="view"></canvas></main>

    <!-- The four panes' borders and names. Drawn over the canvas rather
         than in it: a line in the scene would be a line the camera could
         move, and these belong to the window. -->
    <div id="panes" aria-hidden="true">
      <span>3D</span><span>X</span><span>Y</span><span>Z</span>
    </div>

    <!-- The verbs, always to hand. An icon and a title each, and every one of
         them has a key as well — the help card is that list. -->
    <nav id="bar" aria-label="Tools">
      <button id="cube" title="Create a cube — C" aria-label="Create a cube">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.6 21 7.3v9.4L12 21.4 3 16.7V7.3Z" />
          <path d="M3 7.3 12 12l9-4.7M12 12v9.4" />
        </svg>
      </button>
      <button id="open" title="Open a geometry (.msh) — O" aria-label="Open a geometry">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 19V5.5h6l2 2.5h10V19Z" />
          <path d="M3 9.5h18" />
        </svg>
      </button>
      <!-- Two icons, one per mode, and the button wears the one it is
           currently in: the same hexagon, cut into quadrilaterals when the
           mouse is aimed at the blocks and whole when it is aimed at the
           geometry. A toggle that looks the same either way is a toggle
           you have to click to find out about. -->
      <button
        id="picking"
        disabled
        title="Aim at the geometry instead of the blocks — M"
        aria-label="Aim at the geometry"
        aria-pressed="false"
      >
        <svg class="as-blocks" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.2 20 7.6v8.8L12 20.8 4 16.4V7.6Z" />
          <path d="M12 12V3.2M12 12l8 4.4M12 12l-8 4.4" />
        </svg>
        <svg class="as-geometry" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.2 20 7.6v8.8L12 20.8 4 16.4V7.6Z" />
          <circle cx="12" cy="12" r="2.4" class="dot" />
        </svg>
      </button>
      <button id="box" disabled title="Box the geometry — B" aria-label="Bounding box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6.5h16v11H4Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <button id="classify" disabled title="Put the blocking on the geometry — K" aria-label="Classify">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 17.5c4-7 13-7 17 0" />
          <path d="M6.5 7.5h11v5h-11Z" />
          <circle cx="6.5" cy="12.5" r="1.3" class="dot" />
          <circle cx="17.5" cy="12.5" r="1.3" class="dot" />
        </svg>
      </button>
      <!-- A point being pulled down onto a curve: what the verb does. -->
      <button
        id="attach"
        disabled
        title="Put the selected nodes on the selected entity — A"
        aria-label="Attach nodes"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 17c4-6.5 13-6.5 17 0" />
          <circle cx="12" cy="4.6" r="1.9" class="dot" />
          <path d="M12 7.4v4.2M9.6 9.8 12 12.2l2.4-2.4" />
        </svg>
      </button>
      <button id="console-open" title="Scripts — ;" aria-label="Script console" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 4.5h17v15h-17Z" />
          <path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5" />
        </svg>
      </button>
      <!-- A block cut into a grid: what discretising does to one. -->
      <button id="mesh" title="Discretise every block — E, ⇧E writes it out" aria-label="Mesh">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 6.5h17v13h-17Z" />
          <path d="M9.2 6.5v13M14.8 6.5v13M3.5 10.8h17M3.5 15.2h17" />
        </svg>
      </button>
      <button id="glue" disabled title="Glue the two selected faces — G" aria-label="Glue faces">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.5h5v13H4ZM15 5.5h5v13h-5Z" />
          <path d="M9.5 12h5" />
        </svg>
      </button>
      <button id="pillow" disabled title="Pillow the selected faces — P" aria-label="Pillow">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 3.5h17v17h-17Z" />
          <path d="M7.5 7.5h9v9h-9Z" />
          <path d="M3.5 3.5 7.5 7.5M20.5 3.5 16.5 7.5M3.5 20.5 7.5 16.5M20.5 20.5 16.5 16.5" />
        </svg>
      </button>
      <button id="remove" disabled title="Remove what is selected — Del" aria-label="Remove">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 7h14M10 7V4.5h4V7M6.5 7l1 13h9l1-13" />
        </svg>
      </button>
      <button id="undo" disabled title="Take back the last change — ⌘Z" aria-label="Undo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 5 3.2 8.8 7 12.6" />
          <path d="M3.2 8.8h10.3a5.5 5.5 0 0 1 0 11H9" />
        </svg>
      </button>
      <span class="sep"></span>
      <button id="quad" title="Split into four views — V" aria-label="Split the window" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 3.5h17v17h-17Z" />
          <path d="M12 3.5v17M3.5 12h17" />
        </svg>
      </button>
      <button id="recentre" title="Frame everything — F" aria-label="Frame everything">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 8.5v-5h5M20.5 8.5v-5h-5M3.5 15.5v5h5M20.5 15.5v5h-5" />
          <circle cx="12" cy="12" r="2.6" />
        </svg>
      </button>
      <button id="shot" title="Save a picture — S" aria-label="Save a picture">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 7.5h4l1.6-2.4h5.8L16.5 7.5h4v12h-17Z" />
          <circle cx="12" cy="13" r="3.6" />
        </svg>
      </button>
      <span class="sep"></span>
      <!-- Two panels, and the pair of icons says which is which: sliders
           for how the model is drawn, a cog for what the operations do. -->
      <button id="display" title="Display — Tab" aria-label="Display" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 7h17M3.5 12h17M3.5 17h17" />
          <circle cx="9" cy="7" r="2.1" />
          <circle cx="15.5" cy="12" r="2.1" />
          <circle cx="7.5" cy="17" r="2.1" />
        </svg>
      </button>
      <button id="settings" title="Settings — ," aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5.6" />
          <circle cx="12" cy="12" r="2.4" class="dot" />
          <path
            d="M17.6 12h2.7M15.96 8.04l1.91-1.91M12 6.4V3.7M8.04 8.04 6.13 6.13M6.4 12H3.7M8.04 15.96l-1.91 1.91M12 17.6v2.7M15.96 15.96l1.91 1.91"
          />
        </svg>
      </button>
      <button id="help-open" title="Shortcuts — H" aria-label="Shortcuts">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.8" />
          <path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.3-.9.8-.9 1.5v.5" />
          <circle cx="12" cy="17" r="1" class="dot" />
        </svg>
      </button>
    </nav>

    <!-- How the model is drawn. Every section folds, and what is open is
         remembered: seven groups of controls unfolded at once is a drawer
         you scroll rather than read. -->
    <aside id="drawer" aria-label="Display">
      <details class="section" id="sec-cells">
        <summary>Cells</summary>
        <div id="layers"></div>
      </details>

      <details class="section" id="sec-geometry">
        <summary>Geometry</summary>
        <div id="geometry"></div>
      </details>

      <details class="section" id="sec-mesh">
        <summary>Mesh</summary>
        <div id="mesh-layer"></div>
      </details>

      <details class="section" id="sec-colours">
        <summary>Colours</summary>
        <div id="swatches"></div>
        <div class="row">
          <button id="preset-dark">Dark</button>
          <button id="preset-light">Light</button>
        </div>
        <label class="check"><input id="show-axes" type="checkbox" checked /> X/Y/Z triad</label>
      </details>

      <details class="section" id="sec-picture">
        <summary>Picture</summary>
        <label class="slider"
          ><span>size</span>
          <select id="shot-scale" data-test="shot-scale">
            <option value="1">1× — as on screen</option>
            <option value="2">2× — for a figure</option>
            <option value="4">4×</option>
          </select>
        </label>
        <label class="check"
          ><input id="shot-transparent" type="checkbox" data-test="shot-transparent" /> transparent
          background</label
        >
      </details>
    </aside>

    <!-- What the operations do, as against how they look. Numbers that go
         into the next command rather than into the scene. -->
    <aside id="params" aria-label="Settings">
      <h2>Operations</h2>
      <label class="slider"
        ><span>box margin</span>
        <input id="box-margin" type="range" min="0" max="0.5" step="0.01" data-test="box-margin" />
        <b id="box-margin-n" data-test="box-margin-value">10%</b>
      </label>
      <label class="slider"
        ><span>snap</span>
        <input id="snap" type="range" min="0" max="0.1" step="0.005" data-test="snap" />
        <b id="snap-n" data-test="snap-value">2%</b>
      </label>

      <label class="slider"
        ><span>segments</span>
        <input id="segments" type="range" min="1" max="60" step="1" data-test="segments" />
        <b id="segments-n" data-test="segments-value">10</b>
      </label>

      <h2>History</h2>
      <label class="slider"
        ><span>steps</span>
        <input id="history" type="range" min="0" max="20" step="1" data-test="history" />
        <b id="history-n" data-test="history-steps">5</b>
      </label>
    </aside>

    <!-- Lua, and what it has said. Over the canvas like everything else,
         and shut unless asked for. -->
    <section id="console" aria-label="Script console">
      <header>
        <span>Lua</span>
        <button id="console-save" title="Save the session as a script">save</button>
        <button id="console-clear" title="Clear what is on screen">clear</button>
      </header>
      <div id="console-out" data-test="console-out"></div>
      <textarea
        id="console-in"
        data-test="console-in"
        rows="1"
        spellcheck="false"
        autocomplete="off"
        placeholder="enter runs it, shift-enter makes a line"
      ></textarea>
    </section>

    <!-- The rubber band, while shift is held and the pointer is down. Drawn
         over the canvas rather than in it: a rectangle in the scene would
         be a rectangle the camera could turn. -->
    <div id="lasso" hidden></div>

    <!-- The file picker a browser insists on: a page cannot read a file the
         user has not handed it, so "open" is this, clicked for them. -->
    <input id="msh" type="file" accept=".msh" hidden />

    <footer id="readout">
      <span id="stats"></span>
      <span id="aim" data-test="aim"></span>
      <span id="status"></span>
    </footer>

    <div id="help" role="dialog" aria-label="Keyboard shortcuts">
      <div id="help-card"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
