<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gecko</title>
  </head>
  <body>
    <aside id="panel">
      <h1>gecko<span>-rs</span></h1>
      <p class="sub">Rust kernel · Babylon.js view</p>
      <button id="cube">Create a cube</button>
      <button id="glue" disabled>Glue faces</button>
      <button id="remove" disabled>Remove block</button>
      <button id="recentre">Recentre view</button>
      <div id="stats"></div>

      <h2>Display</h2>
      <div id="swatches"></div>
      <div class="row">
        <button id="preset-dark">Dark</button>
        <button id="preset-light">Light</button>
      </div>
      <label class="check"><input id="show-axes" type="checkbox" checked /> X/Y/Z triad</label>
      <div id="layers"></div>

      <div id="status"></div>
    </aside>
    <main id="stage"><canvas id="view"></canvas></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
